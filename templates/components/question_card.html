<div class="card shadow" id="ask">
    <div class="card-header bg-success text-white">Ask AI Advisor</div>
    <div class="card-body">
        <form action="{{ url_for('ask_question') }}" method="post">
            <label class="form-label" for="question">Your farming question</label>
            <textarea id="question" name="question" class="form-control" rows="8" required placeholder="Example: My tomato leaves are yellow and curling. What should I check?"></textarea>
            <button type="submit" class="btn btn-success mt-3">Ask Question</button>
        </form>
    </div>
</div>
